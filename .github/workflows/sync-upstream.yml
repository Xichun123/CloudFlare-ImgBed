name: Upstream Sync

permissions:
  contents: write
  actions: write
  issues: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
    inputs:
      confirm_breaking_update:
        description: "I have reviewed any compatibility update notice and agree to apply it if present / 我已阅读可能存在的兼容性更新公告，并同意在有此类更新时应用"
        required: true
        default: false
        type: boolean

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check breaking update policy
        id: breaking_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: MarSeventh/CloudFlare-ImgBed
          UPSTREAM_BRANCH: main
          ALLOW_BREAKING_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_breaking_update == true }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh check

      - name: Sync upstream changes
        id: sync
        if: steps.breaking_guard.outputs.blocked != 'true'
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: MarSeventh/CloudFlare-ImgBed
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Complete breaking update notices
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh complete

      - name: Trigger Worker deploy
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Sync failure guidance
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ 上游同步未完成 / Upstream synchronization did not complete"
            echo
            echo "如果日志提示缺少 workflows permission，请配置仓库 Secret UPSTREAM_SYNC_TOKEN：fine-grained PAT 只选择当前 Fork，并授予 Contents 和 Workflows 的 Read and write 权限；classic PAT 需要 repo 和 workflow scopes。默认 GITHUB_TOKEN 无法通过 workflow permissions 获得此权限。"
            echo
            echo "If the log reports missing workflows permission, configure the repository secret UPSTREAM_SYNC_TOKEN: select only this fork for a fine-grained PAT and grant Contents and Workflows read/write permissions, or use a classic PAT with repo and workflow scopes. Workflow permissions cannot grant this capability to the default GITHUB_TOKEN."
            echo
            echo "临时恢复方法：手动执行一次 **Sync fork**，再重新运行本工作流。后续上游再次修改 workflow 时，仍需要 UPSTREAM_SYNC_TOKEN 才能自动同步。"
            echo
            echo "To recover temporarily, manually use **Sync fork**, then rerun this workflow. Future upstream workflow changes still require UPSTREAM_SYNC_TOKEN for automatic synchronization."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::上游同步失败。若日志提示缺少 workflows permission，请配置 UPSTREAM_SYNC_TOKEN；参见本次运行的 Summary。"
          echo "::error::Upstream sync failed. If the log reports missing workflows permission, configure UPSTREAM_SYNC_TOKEN; see this run's summary."
          exit 1
